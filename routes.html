<!DOCTYPE html>
<html>
<head>
    <title>GPX Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; background: #f4f4f4; }

        /* Sidebar & Grid Layout */
        #sidebar { width: 400px; padding: 15px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: white; }
        .controls { margin-bottom: 20px; display: grid; gap: 10px; }

        #list {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two Columns */
            gap: 10px;
            overflow-y: auto;
        }

        .track-card {
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.1s;
            background: #fafafa;
        }
        .track-card:hover { border-color: #3388ff; transform: translateY(2px); }
        .track-card.active { border: 2px solid #3388ff; background: #eef6ff; }

        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; color: white; margin-top: 5px; }
        .Road { background: #3498db; }
        .Gravel { background: #e67e22; }
        .MTB { background: #27ae60; }

        .garmin-btn, .download-btn {
            text-decoration: none;
            margin-top: 5px;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            /*font-weight: bold;*/
            color: #555;
            border: 1px solid #ccc;
            background: #fff;
            transition: all 0.2s;
        }

        .garmin-btn:hover {
            background: #007cc3; /* Garmin Blue */
            color: white;
            border-color: #007cc3;
        }

        .download-btn:hover {
            background: #333;
            color: white;
            border-color: #333;
        }

        #map { flex-grow: 1; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="margin-top:0">GPX Explorer</h2>

    <div class="controls">
        <div class="filter-group">
            <label>Surface</label>
            <select id="typeFilter">
                <option value="All">All Types</option>
                <option value="Road">Road</option>
                <option value="Gravel">Gravel</option>
                <option value="MTB">MTB</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Location</label>
            <select id="locFilter">
                <option value="All">All Regions</option>
            </select>
        </div>
        <div class="filter-group" style="grid-column: span 2;">
            <label>Min Distance: <span id="distVal">0</span> km</label>
            <input type="range" id="minDist" min="0" max="200" value="0">
        </div>
    </div>

    <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    const map = L.map('map').setView([51.505, -0.09], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let allTracks = [];
    let currentGpxLayer = null;

    fetch('gpx/data.json')
        .then(res => res.json())
        .then(data => {
            allTracks = data;
            populateLocationFilter(data);
            renderList();
        });

    function populateLocationFilter(data) {
        const locSelect = document.getElementById('locFilter');
        const uniqueLocations = [...new Set(data.map(t => t.location))].sort();

        uniqueLocations.forEach(loc => {
            const opt = document.createElement('option');
            opt.value = loc;
            opt.textContent = loc;
            locSelect.appendChild(opt);
        });
    }

    function renderList() {
        const listDiv = document.getElementById('list');
        const minD = parseFloat(document.getElementById('minDist').value);
        const typeF = document.getElementById('typeFilter').value;
        const locF = document.getElementById('locFilter').value;

        document.getElementById('distVal').textContent = minD;
        listDiv.innerHTML = '';

        const filtered = allTracks.filter(t => {
            return (t.distance >= minD) &&
                (typeF === 'All' || t.type === typeF) &&
                (locF === 'All' || t.location === locF);
        });

        filtered.forEach(track => {
            const card = document.createElement('div');
            card.className = 'track-card';
            card.innerHTML = `
                <div style="color: #888; font-size: 0.7rem;">${track.location}</div>
                <strong>${track.name}</strong><br>
                <span style="font-size: 0.8rem;">${track.distance} km | ${track.elevation}m+</span><br>
                <div style="margin-top: 8px; display: flex; gap: 5px;">
                    <span class="badge ${track.type}">${track.type}</span>
<!--                    <a href="https://connect.garmin.com/modern/import-data" target="_blank" class="garmin-btn" title="Open Garmin Import">-->
<!--                        Garmin-->
<!--                    </a>-->
                    <a href="${track.file}" download class="download-btn" title="Download GPX">
                        GPX
                    </a>
                </div>
            `;

            // Clicking the card still loads the map, but clicking the buttons won't trigger the map load
            // card.querySelector('.garmin-btn').onclick = (e) => e.stopPropagation();
            card.querySelector('.download-btn').onclick = (e) => e.stopPropagation();

            card.onclick = () => {
                document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                loadGPX(track.file);
            };
            listDiv.appendChild(card);
        });
    }

    function loadGPX(url) {
        if (currentGpxLayer) map.removeLayer(currentGpxLayer);

        currentGpxLayer = new L.GPX(url, {
            async: true,
            marker_options: {
                // Define the start icon
                startIconUrl: 'https://cdn.jsdelivr.net/gh/mpetazzoni/leaflet-gpx@master/icons/pin-icon-start.png',
                // Optional: Hide the end icon or use a different one
                endIconUrl: '',
                shadowUrl: '',
                iconSize: [25, 35],
                iconAnchor: [12, 35]
            },
            polyline_options: { color: '#3371FF', weight: 5, opacity: 0.8 }
        }).on('loaded', e => {
            map.fitBounds(e.target.getBounds(), {padding: [35, 35]});
        }).addTo(map);
    }

    // Bind events
    document.getElementById('minDist').oninput = renderList;
    document.getElementById('typeFilter').onchange = renderList;
    document.getElementById('locFilter').onchange = renderList;
</script>
</body>
</html>
