<!DOCTYPE html>
<html>
<head>
    <title>GPX Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; background: #f4f4f4; }

        /* Sidebar & Grid Layout */
        #sidebar { width: 400px; padding: 15px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: white; }
        .controls { margin-bottom: 20px; display: grid; gap: 10px; }

        #list {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two Columns */
            gap: 10px;
            overflow-y: auto;
        }

        .track-card {
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.1s;
            background: #fafafa;
        }
        .track-card:hover { border-color: #3388ff; transform: translateY(-2px); }
        .track-card.active { border: 2px solid #3388ff; background: #eef6ff; }

        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; color: white; margin-top: 5px; }
        .Road { background: #3498db; }
        .Gravel { background: #e67e22; }
        .MTB { background: #27ae60; }

        #map { flex-grow: 1; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>GPX Explorer</h3>
    <div class="controls">
        <label>Min Distance: <input type="number" id="minDist" value="0" style="width: 60px;"> km</label>
        <label>Surface:
            <select id="typeFilter">
                <option value="All">All Types</option>
                <option value="Road">Road</option>
                <option value="Gravel">Gravel</option>
                <option value="MTB">MTB</option>
            </select>
        </label>
    </div>
    <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.osm.org/{z}/{x}/{y}.png').addTo(map);

    let allTracks = [];
    let currentGpxLayer = null;

    fetch('gpx/data.json')
        .then(res => res.json())
        .then(data => {
            allTracks = data;
            renderList();
        });

    function renderList() {
        const listDiv = document.getElementById('list');
        const min = parseFloat(document.getElementById('minDist').value) || 0;
        const type = document.getElementById('typeFilter').value;

        listDiv.innerHTML = '';

        const filtered = allTracks.filter(t => {
            const matchDist = t.distance >= min;
            const matchType = (type === 'All' || t.type === type);
            return matchDist && matchType;
        });

        filtered.forEach(track => {
            const card = document.createElement('div');
            card.className = 'track-card';
            card.innerHTML = `
                <div style="font-size: 0.7rem; color: #666; text-transform: uppercase;">${track.location}</div>
                <strong style="display: block; margin-bottom: 5px;">${track.name}</strong>
                <span>${track.distance}km | ${track.elevation}m+</span><br>
                <span class="badge ${track.type}">${track.type}</span>
            `;
            card.onclick = () => {
                // Remove previous "active" highlights
                document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                loadGPX(track.file);
            };
            listDiv.appendChild(card);
        });
    }

    function loadGPX(url) {
        if (currentGpxLayer) map.removeLayer(currentGpxLayer);

        currentGpxLayer = new L.GPX(url, {
            async: true,
            marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' },
            polyline_options: { color: '#ff4400', opacity: 0.8, weight: 4 }
        }).on('loaded', (e) => {
            map.fitBounds(e.target.getBounds(), { padding: [50, 50] });
        }).addTo(map);
    }

    // Event Listeners
    document.getElementById('minDist').oninput = renderList;
    document.getElementById('typeFilter').onchange = renderList;
</script>
</body>
</html>
