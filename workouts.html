<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Workout Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Custom Orange Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #f1f5f9;
            border-radius: 10px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 2px solid white;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen text-slate-900">

<nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-black italic tracking-tighter text-slate-800">POWER<span class="text-amber-500">LAB</span></h1>
        <div class="text-sm font-bold text-slate-400 uppercase tracking-widest">
            <span id="count" class="text-slate-900">0</span> Workouts
        </div>
    </div>
</nav>

<main class="max-w-5xl mx-auto p-6 md:p-10">

    <section class="mb-10">
        <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-200/60">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">

                <div>
                    <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-6">Target Zones</h3>
                    <div id="labelContainer" class="flex flex-wrap gap-2">
                    </div>
                </div>

                <div class="space-y-6 bg-slate-50 p-6 rounded-2xl">
                    <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2">TSS Intensity Range</h3>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <div class="flex justify-between text-[11px] font-bold mb-2">
                                <span class="text-slate-400 uppercase">Min TSS</span>
                                <span class="text-amber-600" id="minValDisplay">0</span>
                            </div>
                            <input type="range" id="minTss" min="0" max="250" value="30">
                        </div>

                        <div>
                            <div class="flex justify-between text-[11px] font-bold mb-2">
                                <span class="text-slate-400 uppercase">Max TSS</span>
                                <span class="text-amber-600" id="maxValDisplay">250</span>
                            </div>
                            <input type="range" id="maxTss" min="0" max="300" value="250">
                        </div>
                    </div>
                </div>

            </div>

            <div class="mt-8 pt-6 border-t border-slate-50 flex justify-center">
                <button id="resetBtn" class="text-[10px] font-black uppercase tracking-widest text-slate-300 hover:text-rose-500 transition-colors">Reset All Filters</button>
            </div>
        </div>
    </section>

    <div id="results" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-2">
    </div>

</main>

<script>
    let workouts = [];
    let selectedLabels = new Set();

    function getSvgPath(name) {
        let n = name.replace(/\//g, '-').replace(/\\/g, '-').replace(/ /g, '_').replace(/\?/g, '').replace(/\"/g, '').replace(/:/g, '');
        return `images/${n}.svg`;
    }

    async function init() {
        try {
            const res = await fetch('workouts.json');
            const data = await res.json();
            workouts = data.rawDB;
            renderLabels(workouts);
            updateUI();
        } catch (e) { console.error(e); }
    }

    function renderLabels(data) {
        const container = document.getElementById('labelContainer');
        const labels = [...new Set(data.flatMap(w => w.labels))].sort();
        container.innerHTML = labels.map(l => `
            <button onclick="toggleLabel('${l}', this)"
                    class="px-4 py-2 rounded-xl border border-slate-100 text-[11px] font-bold transition-all bg-white text-slate-500 hover:border-amber-200">
                ${l}
            </button>
        `).join('');
    }

    function toggleLabel(label, el) {
        if (selectedLabels.has(label)) {
            selectedLabels.delete(label);
            el.classList.remove('bg-amber-500', 'text-white', 'border-amber-500', 'shadow-md', 'shadow-amber-100');
            el.classList.add('bg-white', 'text-slate-500');
        } else {
            selectedLabels.add(label);
            el.classList.add('bg-amber-500', 'text-white', 'border-amber-500', 'shadow-md', 'shadow-amber-100');
            el.classList.remove('bg-white', 'text-slate-500');
        }
        updateUI();
    }

    function updateUI() {
        const minEl = document.getElementById('minTss');
        const maxEl = document.getElementById('maxTss');

        // Logic to prevent Min from exceeding Max
        if (parseInt(minEl.value) > parseInt(maxEl.value)) {
            minEl.value = maxEl.value;
        }

        const minVal = parseInt(minEl.value);
        const maxVal = parseInt(maxEl.value);

        document.getElementById('minValDisplay').innerText = minVal;
        document.getElementById('maxValDisplay').innerText = maxVal;

        const filtered = workouts.filter(w => {
            const inRange = w.TSS >= minVal && w.TSS <= maxVal;
            const hasLabel = selectedLabels.size === 0 || w.labels.some(l => selectedLabels.has(l));
            return inRange && hasLabel;
        });

        document.getElementById('count').innerText = filtered.length;
        const container = document.getElementById('results');

        container.innerHTML = filtered.map(w => `
            <div class="group bg-white rounded-[2rem] p-8 border border-slate-200/50 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex-1">
                        <div class="flex gap-2 mb-3">
                            ${w.labels.map(l => `<span class="text-[9px] font-black bg-amber-50 text-amber-600 px-2 py-1 rounded-lg uppercase tracking-tighter">${l}</span>`).join('')}
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800 leading-tight group-hover:text-amber-600 transition-colors">${w.name}</h2>
                        <p class="text-slate-400 text-xs mt-2 font-medium">By ${w.author}</p>
                    </div>
                    <div class="ml-4 bg-slate-50 rounded-2xl p-4 text-center min-w-[70px]">
                        <span class="text-2xl font-black text-slate-800 block">${w.TSS}</span>
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">TSS</span>
                    </div>
                </div>

                <div class="mt-auto pt-8 border-t border-slate-50">
                    <img src="${getSvgPath(w.name)}"
                         class="w-full h-auto max-h-[140px] opacity-90 group-hover:opacity-100 transition-opacity"
                         onerror="this.style.display='none'">
                </div>
            </div>
        `).join('');
    }

    document.getElementById('minTss').addEventListener('input', updateUI);
    document.getElementById('maxTss').addEventListener('input', updateUI);
    document.getElementById('resetBtn').addEventListener('click', () => {
        selectedLabels.clear();
        document.getElementById('minTss').value = 30;
        document.getElementById('maxTss').value = 250;
        document.querySelectorAll('#labelContainer button').forEach(b => {
            b.classList.remove('bg-amber-500', 'text-white', 'border-amber-500', 'shadow-md', 'shadow-amber-100');
            b.classList.add('bg-white', 'text-slate-500');
        });
        updateUI();
    });

    init();
</script>
</body>
</html>
