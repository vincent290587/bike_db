<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Library Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range] { accent-color: #f59e0b; }
        .workout-svg { max-height: 100px; width: 100%; object-fit: contain; transition: transform 0.3s ease; }
        .workout-card:hover .workout-svg { transform: scale(1.05); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 text-slate-800">

<div class="max-w-4xl mx-auto">
    <header class="mb-8">
        <h1 class="text-4xl font-black tracking-tight text-slate-900">Workout Library</h1>
        <p class="text-slate-500 mt-1">Advanced filtering for your training sessions</p>
    </header>

    <div class="sticky top-4 z-20 bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-white/50 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <div>
                <label class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-3 block">Filter by Zones / Labels</label>
                <div id="labelContainer" class="flex flex-wrap gap-2">
                    <span class="text-slate-300 animate-pulse text-sm">Loading labels...</span>
                </div>
            </div>

            <div>
                <label class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-3 block text-right">TSS Range</label>
                <div class="flex items-center gap-4">
                    <div class="flex-1">
                        <span class="text-[10px] text-slate-400 uppercase">Min: <span id="minTssVal" class="font-bold text-slate-700">0</span></span>
                        <input type="range" id="minTss" min="0" max="250" value="0" class="w-full">
                    </div>
                    <div class="flex-1">
                        <span class="text-[10px] text-slate-400 uppercase">Max: <span id="maxTssVal" class="font-bold text-slate-700">250</span></span>
                        <input type="range" id="maxTss" min="0" max="250" value="250" class="w-full">
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center">
            <div class="text-sm font-medium text-slate-400">
                Found <span id="count" class="text-amber-600 font-bold">0</span> workouts
            </div>
            <button id="resetBtn" class="text-xs font-bold uppercase text-rose-400 hover:text-rose-600 transition-colors">
                Clear All Filters
            </button>
        </div>
    </div>

    <div id="results" class="grid gap-6 sm:grid-cols-2">
    </div>
</div>

<script>
    let workouts = [];
    let selectedLabels = new Set();

    // 1. Filename Logic (Matches your Dart code)
    function getSvgPath(name) {
        let n = name.replace(/\//g, '-').replace(/\\/g, '-').replace(/ /g, '_').replace(/\?/g, '').replace(/\"/g, '').replace(/:/g, '');
        return `images/${n}.svg`;
    }

    async function init() {
        try {
            const res = await fetch('workouts.json');
            const data = await res.json();
            workouts = data.rawDB;

            renderLabelCheckboxes(workouts);
            updateUI();
        } catch (e) {
            console.error(e);
        }
    }

    // 2. Build Checkboxes dynamically
    function renderLabelCheckboxes(data) {
        const container = document.getElementById('labelContainer');
        const labels = [...new Set(data.flatMap(w => w.labels))].sort();

        container.innerHTML = labels.map(l => `
            <button onclick="toggleLabel('${l}', this)"
                    class="px-3 py-1 rounded-full border border-slate-200 text-xs font-bold transition-all hover:bg-slate-100 bg-white text-slate-600">
                ${l}
            </button>
        `).join('');
    }

    function toggleLabel(label, el) {
        if (selectedLabels.has(label)) {
            selectedLabels.delete(label);
            el.classList.remove('bg-amber-500', 'text-white', 'border-amber-500');
            el.classList.add('bg-white', 'text-slate-600');
        } else {
            selectedLabels.add(label);
            el.classList.add('bg-amber-500', 'text-white', 'border-amber-500');
            el.classList.remove('bg-white', 'text-slate-600');
        }
        updateUI();
    }

    // 3. Main Filter & Render Logic
    function updateUI() {
        const min = parseInt(document.getElementById('minTss').value);
        const max = parseInt(document.getElementById('maxTss').value);

        document.getElementById('minTssVal').innerText = min;
        document.getElementById('maxTssVal').innerText = max;

        const filtered = workouts.filter(w => {
            const inTssRange = w.TSS >= min && w.TSS <= max;
            // If no labels selected, show all. If labels selected, check if workout has at least one.
            const matchesLabels = selectedLabels.size === 0 || w.labels.some(l => selectedLabels.has(l));
            return inTssRange && matchesLabels;
        });

        const container = document.getElementById('results');
        document.getElementById('count').innerText = filtered.length;

        container.innerHTML = filtered.map(w => `
            <div class="workout-card bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all flex flex-col">
                <div class="bg-slate-50 p-6 flex justify-center items-center h-40 border-b border-slate-50">
                    <img src="${getSvgPath(w.name)}" class="workout-svg" onerror="this.src='https://placehold.co/200x80?text=No+Preview'">
                </div>
                <div class="p-6">
                    <div class="flex flex-wrap gap-1 mb-3">
                        ${w.labels.map(l => `<span class="text-[9px] font-black bg-slate-100 text-slate-500 px-2 py-0.5 rounded tracking-tighter">${l}</span>`).join('')}
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 leading-snug">${w.name}</h2>
                    <div class="mt-4 flex justify-between items-end">
                        <span class="text-xs text-slate-400 italic font-medium">By ${w.author}</span>
                        <div class="text-right">
                            <div class="text-2xl font-black text-amber-600 leading-none">${w.TSS}</div>
                            <div class="text-[10px] font-bold text-slate-300 uppercase">TSS</div>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 4. Listeners & Reset
    document.getElementById('minTss').addEventListener('input', updateUI);
    document.getElementById('maxTss').addEventListener('input', updateUI);
    document.getElementById('resetBtn').addEventListener('click', () => {
        selectedLabels.clear();
        document.getElementById('minTss').value = 0;
        document.getElementById('maxTss').value = 250;
        // Visual reset of buttons
        document.querySelectorAll('#labelContainer button').forEach(b => {
            b.classList.remove('bg-amber-500', 'text-white', 'border-amber-500');
            b.classList.add('bg-white', 'text-slate-600');
        });
        updateUI();
    });

    init();
</script>
</body>
</html>
