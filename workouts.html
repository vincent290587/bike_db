<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
    <style>
        /* Custom Amber styling for the slider */
        .noUi-connect { background: #f59e0b; }
        .noUi-handle { border-radius: 50%; cursor: pointer; }
        .workout-svg { width: 100%; max-height: 120px; object-fit: contain; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 text-slate-800">

<div class="max-w-4xl mx-auto">
    <header class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="text-4xl font-black tracking-tight text-slate-900">Workouts</h1>
            <p class="text-slate-500">Showing <span id="count" class="text-amber-600 font-bold">0</span> sessions</p>
        </div>
        <button id="resetBtn" class="text-xs font-bold uppercase text-slate-400 hover:text-rose-500 transition-colors mb-2">Reset Filters</button>
    </header>

    <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100 mb-8 space-y-8">
        <div>
            <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-4 block text-center">Filter by Category</label>
            <div id="labelContainer" class="flex flex-wrap justify-center gap-2">
            </div>
        </div>

        <div class="px-4 pb-4">
            <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-8 block text-center">TSS Range: <span id="tssRangeVal" class="text-slate-900 ml-2">0 - 250</span></label>
            <div id="tssSlider" class="mx-auto max-w-md"></div>
        </div>
    </div>

    <div id="results" class="grid gap-6 sm:grid-cols-2">
    </div>
</div>

<script>
    let workouts = [];
    let selectedLabels = new Set();
    let tssSlider;

    // 1. Filename Logic
    function getSvgPath(name) {
        let n = name.replace(/\//g, '-').replace(/\\/g, '-').replace(/ /g, '_').replace(/\?/g, '').replace(/\"/g, '').replace(/:/g, '');
        return `images/${n}.svg`;
    }

    async function init() {
        try {
            const res = await fetch('workouts.json');
            const data = await res.json();
            workouts = data.rawDB;

            setupSlider();
            renderLabelCheckboxes(workouts);
            updateUI();
        } catch (e) { console.error("Data load error:", e); }
    }

    // 2. Setup Dual Slider
    function setupSlider() {
        const sliderElem = document.getElementById('tssSlider');
        tssSlider = noUiSlider.create(sliderElem, {
            start: [0, 250],
            connect: true,
            range: { 'min': 0, 'max': 250 },
            step: 5,
            format: { to: v => Math.round(v), from: v => v }
        });

        tssSlider.on('update', (values) => {
            document.getElementById('tssRangeVal').innerText = `${values[0]} - ${values[1]}`;
            updateUI();
        });
    }

    function renderLabelCheckboxes(data) {
        const container = document.getElementById('labelContainer');
        const labels = [...new Set(data.flatMap(w => w.labels))].sort();
        container.innerHTML = labels.map(l => `
            <button onclick="toggleLabel('${l}', this)"
                    class="px-4 py-1.5 rounded-full border border-slate-200 text-xs font-bold transition-all hover:border-amber-300 bg-white text-slate-500">
                ${l}
            </button>
        `).join('');
    }

    function toggleLabel(label, el) {
        if (selectedLabels.has(label)) {
            selectedLabels.delete(label);
            el.classList.replace('bg-amber-500', 'bg-white');
            el.classList.replace('text-white', 'text-slate-500');
            el.classList.remove('border-amber-500');
        } else {
            selectedLabels.add(label);
            el.classList.replace('bg-white', 'bg-amber-500');
            el.classList.replace('text-slate-500', 'text-white');
            el.classList.add('border-amber-500');
        }
        updateUI();
    }

    // 3. Render Cards (SVG under description)
    function updateUI() {
        if (!tssSlider) return;
        const [min, max] = tssSlider.get();

        const filtered = workouts.filter(w => {
            const inRange = w.TSS >= min && w.TSS <= max;
            const hasLabel = selectedLabels.size === 0 || w.labels.some(l => selectedLabels.has(l));
            return inRange && hasLabel;
        });

        document.getElementById('count').innerText = filtered.length;
        const container = document.getElementById('results');

        container.innerHTML = filtered.map(w => `
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition-shadow">
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 leading-tight">${w.name}</h2>
                            <p class="text-slate-400 text-xs mt-1 italic">By ${w.author}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-black text-amber-600 block leading-none">${w.TSS}</span>
                            <span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">TSS</span>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-1 mb-6">
                        ${w.labels.map(l => `<span class="text-[9px] font-black bg-slate-50 text-slate-400 px-2 py-0.5 rounded">${l}</span>`).join('')}
                    </div>
                </div>

                <div class="mt-auto pt-4 border-t border-slate-50">
                    <img src="${getSvgPath(w.name)}" class="workout-svg" onerror="this.src='https://placehold.co/300x100?text=No+Preview'">
                </div>
            </div>
        `).join('');
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
        selectedLabels.clear();
        tssSlider.set([0, 250]);
        document.querySelectorAll('#labelContainer button').forEach(b => {
            b.classList.remove('bg-amber-500', 'text-white', 'border-amber-500');
            b.classList.add('bg-white', 'text-slate-500');
        });
        updateUI();
    });

    init();
</script>
</body>
</html>
