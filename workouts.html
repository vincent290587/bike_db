<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range] { accent-color: #f59e0b; }
        /* Ensure SVGs don't overflow their container */
        .workout-svg { max-height: 80px; width: 100%; object-fit: contain; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-12 text-slate-800">

<div class="max-w-3xl mx-auto">
    <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">Workout Library</h1>
        <p class="text-slate-500 mt-2">Visual training guides</p>
    </header>

    <div class="sticky top-4 z-10 flex flex-wrap items-end gap-8 bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-white mb-10">
        <div class="flex flex-col flex-1 min-w-[200px]">
            <label for="zoneFilter" class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Training Zone</label>
            <select id="zoneFilter" class="bg-slate-100 border-none p-3 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none transition-all cursor-pointer">
                <option value="">All Zones</option>
            </select>
        </div>

        <div class="flex flex-col flex-1 min-w-[200px]">
            <div class="flex justify-between mb-2">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Min TSS</label>
                <span class="text-amber-600 font-bold"><span id="tssVal">0</span></span>
            </div>
            <input type="range" id="tssFilter" min="0" max="200" value="0" class="w-full cursor-pointer">
        </div>

        <button id="resetBtn" class="text-sm font-semibold text-slate-400 hover:text-rose-500 transition-colors pb-3">Reset</button>
    </div>

    <div class="mb-4 text-sm text-slate-400 font-medium">
        Showing <span id="count" class="text-slate-900">0</span> workouts
    </div>

    <div id="results" class="grid gap-6">
        <div class="text-center py-20 text-slate-400">Loading workouts...</div>
    </div>
</div>

<script>
    let workouts = [];

    // Replicating your Dart logic for filenames
    function getSvgPath(name) {
        let nameSVG = name;
        nameSVG = nameSVG.replace(/\//g, '-');
        nameSVG = nameSVG.replace(/\\/g, '-');
        nameSVG = nameSVG.replace(/ /g, '_');
        nameSVG = nameSVG.replace(/\?/g, '');
        nameSVG = nameSVG.replace(/\"/g, '');
        nameSVG = nameSVG.replace(/:/g, '');
        return `images/${nameSVG}.svg`;
    }

    async function loadWorkouts() {
        try {
            const response = await fetch('workouts.json');
            const data = await response.json();
            workouts = data.rawDB;
            populateZones(workouts);
            renderWorkouts(workouts);
        } catch (err) {
            document.getElementById('results').innerHTML = `<div class="text-red-500">Error loading data.</div>`;
        }
    }

    function populateZones(data) {
        const select = document.getElementById('zoneFilter');
        const allLabels = data.flatMap(w => w.labels);
        const uniqueLabels = [...new Set(allLabels)].sort();
        uniqueLabels.forEach(label => {
            const opt = document.createElement('option');
            opt.value = label;
            opt.innerText = label;
            select.appendChild(opt);
        });
    }

    function renderWorkouts(data) {
        const container = document.getElementById('results');
        document.getElementById('count').innerText = data.length;

        if(data.length === 0) {
            container.innerHTML = `<p class="text-slate-400 italic text-center py-10">No workouts found.</p>`;
            return;
        }

        container.innerHTML = data.map(w => {
            const svgUrl = getSvgPath(w.name);
            return `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden group hover:shadow-md transition-all">
                <div class="bg-slate-100 p-4 border-b border-slate-50 flex justify-center items-center">
                    <img src="${svgUrl}"
                         alt="${w.name}"
                         class="workout-svg"
                         onerror="this.src='https://placehold.co/400x100?text=No+Preview'">
                </div>

                <div class="p-5 flex items-center justify-between">
                    <div>
                        <div class="flex gap-2 mb-1">
                            ${w.labels.map(l => `<span class="text-[9px] font-black uppercase px-2 py-0.5 bg-amber-100 text-amber-700 rounded">${l}</span>`).join('')}
                        </div>
                        <h2 class="text-lg font-bold text-slate-800 leading-tight">${w.name}</h2>
                        <p class="text-slate-400 text-xs mt-1 italic font-medium">By ${w.author}</p>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <span class="text-2xl font-black text-slate-900">${w.TSS}</span>
                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">TSS</span>
                    </div>
                </div>
            </div>
            `;
        }).join('');
    }

    function filterData() {
        const minTss = parseInt(document.getElementById('tssFilter').value);
        const selectedZone = document.getElementById('zoneFilter').value;
        document.getElementById('tssVal').innerText = minTss;
        const filtered = workouts.filter(w => {
            const matchesTss = w.TSS >= minTss;
            const matchesZone = selectedZone === "" || w.labels.includes(selectedZone);
            return matchesTss && matchesZone;
        });
        renderWorkouts(filtered);
    }

    function resetFilters() {
        document.getElementById('tssFilter').value = 0;
        document.getElementById('zoneFilter').value = "";
        filterData();
    }

    document.getElementById('tssFilter').addEventListener('input', filterData);
    document.getElementById('zoneFilter').addEventListener('change', filterData);
    document.getElementById('resetBtn').addEventListener('click', resetFilters);

    loadWorkouts();
</script>
</body>
</html>
